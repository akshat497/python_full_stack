<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        background-color: black;
        color: white;
        width: 100px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 10px 5px 15px 5px  gray;
        background: url("https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcQ_Zuz3haRHrSz0f3bnMlUTGa14Qc7Z5LLQ3-l04P98hv9CMXQU");
        background-size: cover;
        border-radius: 10px;
        display: inline-block;
        margin: 10px;
        cursor: pointer;
        transition: all 1s ease;

     
    }
    div:hover{
        transform: scale(1.2) rotate(360deg) translateX(100px);
    }

</style>
<body>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    
</body>
</html>
